# Packaging degli installer per OS con firma e auto-update (electron-updater).
# Coerente con knowledge/architettura/packaging-distribuzione.md.
# La CI esegue uno smoke packaging non firmato; gli installer completi per OS
# sono generati dal workflow manuale dedicato.
appId: co.italianbuilders.magistra
productName: Magistra
copyright: Italian Builders
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

# Le dipendenze native (in futuro PGlite, LanceDB) restano fuori dall'asar.
asar: true
asarUnpack:
  - resources/**

publish:
  provider: github
  owner: Italian-Builders-Org
  repo: magistra

win:
  # Target MVP per i primi tester Windows. ARM64 verrà abilitato dopo la
  # validazione di dipendenze native, firma e installer sulla piattaforma.
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Magistra

mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist

linux:
  target:
    - AppImage
  category: Office
