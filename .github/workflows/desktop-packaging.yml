name: Desktop packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            command: npm run package:desktop:win
            artifact: magistra-windows
          - platform: macos
            runner: macos-latest
            command: npm run package:desktop:mac
            artifact: magistra-macos
          - platform: linux
            runner: ubuntu-latest
            command: npm run package:desktop:linux
            artifact: magistra-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Package desktop
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/release/**
