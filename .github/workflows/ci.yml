name: CI

# Gira sulle PR verso main/dev e sui push a quei rami (post-merge).
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Annulla le run superate sullo stesso ref per risparmiare minuti di CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Valida knowledge base
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Formattazione
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test core
        run: npm run test:core

      - name: Build
        run: npm run build
